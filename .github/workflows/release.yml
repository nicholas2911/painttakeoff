name: release

# Push a version tag to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# electron-builder publishes the NSIS installer + latest.yml + portable exe
# to a GitHub Release; installed apps auto-update from it.
on:
  push:
    tags:
      - 'v*'

# electron-builder creates the GitHub Release via GITHUB_TOKEN — needs write.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # A tag that doesn't match package.json would publish a release whose
      # files carry a different version than its tag — refuse it up front.
      - name: Check tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build web bundle
        run: npm run build

      - name: Package and publish to GitHub Releases
        run: npx electron-builder --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code signing certificate — make sure signing is skipped.
          CSC_LINK: ''
          WIN_CSC_LINK: ''
